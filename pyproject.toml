[project]
name = "refund-raccoon"
version = "0.1.0"
description = "Brownfield-to-Temporal demo: a refund agent under chaos, before and after (Temporal + Nexus)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "anthropic>=0.40",
  "langgraph>=1.0",
  "temporalio>=1.23",
  "nexus-rpc>=1.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not temporal'"
asyncio_default_fixture_loop_scope = "function"
markers = ["temporal: needs a running Temporal dev server with the raccoon namespaces"]

[tool.setuptools.packages.find]
include = ["raccoon*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["ASYNC210", "ASYNC230", "ASYNC251", "BLE001", "S110"]
