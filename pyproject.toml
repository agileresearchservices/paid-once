[project]
name = "paid-once"
version = "0.1.0"
description = "Brownfield-to-Temporal demo: a refund agent under chaos, before and after (Temporal + Nexus)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "anthropic>=0.40",
  "langgraph>=1.0",
  "temporalio>=1.23",
  "nexus-rpc>=1.1",
  "cryptography>=50.0.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not temporal'"
asyncio_default_fixture_loop_scope = "function"
markers = ["temporal: Lane 2 + Nexus integration tests; run with `make test-temporal` (own throwaway server)"]

[tool.setuptools.packages.find]
include = ["paidonce*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["ASYNC210", "ASYNC230", "ASYNC251", "BLE001", "S110"]
